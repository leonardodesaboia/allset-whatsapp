services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: allset
      POSTGRES_PASSWORD: allset
      POSTGRES_DB: allset
    ports:
      - "5432:5432"
    volumes:
      - allset_db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: allset
      MINIO_ROOT_PASSWORD: allset1234
    ports:
      - "9000:9000"   # API S3-compatível
      - "9001:9001"   # Console web
    volumes:
      - allset_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 allset allset1234 &&
        mc mb --ignore-existing local/allset &&
        echo 'Bucket allset criado.'
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - allset_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Worker BullMQ — processa jobs assíncronos (dispatch, áudio, expiração, reengajamento).
  # Usa o mesmo código-fonte que o serviço web; separado para escalar independentemente.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://allset:allset@db:5432/allset
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_PREFIX: allset:development
      NODE_ENV: ${NODE_ENV:-development}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MESSAGING_DEFAULT_PROVIDER: ${MESSAGING_DEFAULT_PROVIDER:-evolution}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-allset}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-allset}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-allset1234}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      RECRUITMENT_REENGAGEMENT_AFTER_HOURS: ${RECRUITMENT_REENGAGEMENT_AFTER_HOURS:-24}
      RECRUITMENT_REENGAGEMENT_MAX_ATTEMPTS: ${RECRUITMENT_REENGAGEMENT_MAX_ATTEMPTS:-2}
      OPPORTUNITY_EXPIRY_HOURS: ${OPPORTUNITY_EXPIRY_HOURS:-4}

volumes:
  allset_db_data:
  allset_minio_data:
  allset_redis_data:
